<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="dot-475569" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#475569"/></marker><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="dot-2563eb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#2563eb"/></marker><marker id="arrow-9ca3af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="dot-9ca3af" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#9ca3af"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="520" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="36" y="42" font-size="11" fill="#6b7280">«device»</text><text x="36" y="62" font-size="15" font-weight="700" fill="#1f2937">Laptop (host): Chrome and the forwarder live here</text>
<rect x="440" y="70" width="520" height="420" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><text x="456" y="92" font-size="11" fill="#6b7280">«container»</text><text x="456" y="112" font-size="15" font-weight="700" fill="#1f2937">Docker, devcontainer or Apple container</text>
<rect x="60" y="90" width="320" height="80" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="220.0" y="118.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Google Chrome</text>
<text x="220.0" y="134.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">separate debug profile</text>
<text x="220.0" y="150.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">listens on 127.0.0.1:9222 only</text>
<rect x="60" y="240" width="150" height="90" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="135.0" y="273.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Published port</text>
<text x="135.0" y="289.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">-p 127.0.0.1:5173:5173</text>
<text x="135.0" y="305.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">into the container</text>
<rect x="230" y="240" width="150" height="90" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="305.0" y="273.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">socat / CDP proxy</text>
<text x="305.0" y="289.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">listens 0.0.0.0:9223</text>
<text x="305.0" y="305.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">forwards to 127.0.0.1:9222</text>
<rect x="470" y="130" width="220" height="70" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="580.0" y="161.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Claude Code</text>
<text x="580.0" y="177.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">the agent, inside the sandbox</text>
<rect x="720" y="130" width="220" height="90" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="830.0" y="163.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">chrome-devtools MCP</text>
<text x="830.0" y="179.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">--browser-url</text>
<text x="830.0" y="195.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">http://192.168.64.1:9223</text>
<rect x="470" y="330" width="220" height="90" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="580.0" y="363.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Dev server</text>
<text x="580.0" y="379.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">npm run dev inside</text>
<text x="580.0" y="395.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">listens on 0.0.0.0:5173</text>
<polyline points="690,165 720,165" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-475569)"/>
<text x="705" y="156" text-anchor="middle" font-size="11" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">stdio</text>
<polyline points="830,220 830,285 380,285" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-475569)"/>
<text x="600" y="262" text-anchor="middle" font-size="11" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">CDP to the host's IP as seen from inside</text>
<text x="600" y="276" text-anchor="middle" font-size="11" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Host header is an IP literal, so Chrome accepts it</text>
<polyline points="305,240 305,170" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-475569)"/>
<text x="315" y="210" text-anchor="start" font-size="11" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">127.0.0.1:9222</text>
<polyline points="120,170 120,240" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-475569)"/>
<text x="130" y="210" text-anchor="start" font-size="11" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">http://localhost:5173</text>
<polyline points="135,330 135,375 470,375" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-475569)"/>
<text x="300" y="366" text-anchor="middle" font-size="11" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">to container port 5173</text>
<text x="470" y="447" text-anchor="start" font-size="11.5" fill="#6b7280">192.168.64.1 = the host from the container's view</text>
<text x="470" y="462" text-anchor="start" font-size="11.5" fill="#6b7280">(Apple container gateway; Docker: host.docker.internal's IP)</text>
<text x="60" y="505" text-anchor="start" font-size="11.5" fill="#6b7280">Chrome runs on the host, so URLs are the host's view: the dev server must publish its port to be visible to Chrome,</text>
<text x="60" y="520" text-anchor="start" font-size="11.5" fill="#6b7280">and the MCP must address the host by IP (or use the Host-rewriting proxy when it needs a hostname).</text>
</svg>
