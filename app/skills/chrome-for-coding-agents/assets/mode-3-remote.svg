<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="dot-475569" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#475569"/></marker><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="dot-2563eb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#2563eb"/></marker><marker id="arrow-9ca3af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="dot-9ca3af" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#9ca3af"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="40" width="420" height="460" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="36" y="62" font-size="11" fill="#6b7280">«device»</text><text x="36" y="82" font-size="15" font-weight="700" fill="#1f2937">Laptop: Chrome and the SSH client</text>
<rect x="560" y="40" width="420" height="460" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="576" y="62" font-size="11" fill="#6b7280">«device»</text><text x="576" y="82" font-size="15" font-weight="700" fill="#1f2937">Dev server: the agent runs here</text>
<rect x="50" y="90" width="360" height="60" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="230.0" y="116.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">ssh client</text>
<text x="230.0" y="132.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">ssh -R 9222:127.0.0.1:9222 -L 5173:127.0.0.1:5173 server</text>
<rect x="50" y="260" width="360" height="60" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="230.0" y="286.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Google Chrome, debug profile</text>
<text x="230.0" y="302.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">--remote-debugging-port=9222 (127.0.0.1)</text>
<rect x="50" y="400" width="360" height="60" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="230.0" y="426.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">localhost:5173 on the laptop</text>
<text x="230.0" y="442.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">forward tunnel entrance (-L)</text>
<rect x="590" y="90" width="360" height="50" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="770.0" y="111.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">sshd</text>
<text x="770.0" y="127.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">your terminal session runs the agent</text>
<rect x="590" y="160" width="150" height="60" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="665.0" y="186.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Claude Code</text>
<text x="665.0" y="202.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">the agent</text>
<rect x="760" y="160" width="190" height="70" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="855.0" y="183.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">chrome-devtools MCP</text>
<text x="855.0" y="199.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">--browser-url</text>
<text x="855.0" y="215.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">http://127.0.0.1:9222</text>
<rect x="590" y="260" width="360" height="60" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="770.0" y="286.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">127.0.0.1:9222 on the server</text>
<text x="770.0" y="302.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">reverse tunnel entrance (-R)</text>
<rect x="590" y="400" width="360" height="60" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="770.0" y="426.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Dev server</text>
<text x="770.0" y="442.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#374151">npm run dev, 127.0.0.1:5173</text>
<polyline points="410,115 590,115" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-2563eb)"/>
<text x="500" y="88" text-anchor="middle" font-size="11" fill="#2563eb" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">SSH session, TCP 22</text>
<text x="500" y="102" text-anchor="middle" font-size="11" fill="#2563eb" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">carries both tunnels</text>
<polyline points="665,140 665,160" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-475569)"/>
<polyline points="740,190 760,190" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-475569)"/>
<polyline points="855,230 855,260" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-475569)"/>
<text x="865" y="250" text-anchor="start" font-size="11" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">CDP</text>
<polyline points="590,290 410,290" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-2563eb)"/>
<text x="500" y="282" text-anchor="middle" font-size="11" fill="#2563eb" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">-R 9222: inside the SSH tunnel</text>
<polyline points="230,320 230,400" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-475569)"/>
<text x="240" y="365" text-anchor="start" font-size="11" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">http://localhost:5173</text>
<polyline points="410,430 590,430" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-2563eb)"/>
<text x="500" y="422" text-anchor="middle" font-size="11" fill="#2563eb" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">-L 5173: inside the SSH tunnel</text>
<text x="50" y="486" text-anchor="start" font-size="11.5" fill="#6b7280">Chrome sees only localhost traffic: no proxy, no Host trick.</text>
<text x="50" y="530" text-anchor="start" font-size="11.5" fill="#6b7280">Blue = carried inside the SSH connection. Both tunnel ends are loopback, nothing is exposed on either network.</text>
<text x="50" y="545" text-anchor="start" font-size="11.5" fill="#6b7280">The same MCP config (127.0.0.1:9222) works on the laptop and on the server.</text>
</svg>
